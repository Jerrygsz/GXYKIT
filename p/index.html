    if (e.key === 'ArrowRight') nextLightboxImg(1);
  }
});

// ===== QUOTE SYSTEM =====
let quoteCart = [];
let quoteCustomer = { name: '', company: '', email: '', date: '' };
const QUOTE_STORAGE_KEY = 'gxykit_quote';
const QUOTE_CUSTOMER_KEY = 'gxykit_quote_customer';

function saveQuoteToStorage() {
  try {
    localStorage.setItem(QUOTE_STORAGE_KEY, JSON.stringify(quoteCart));
    localStorage.setItem(QUOTE_CUSTOMER_KEY, JSON.stringify(quoteCustomer));
  } catch(e) {}
}

function loadQuoteFromStorage() {
  try {
    const savedCart = localStorage.getItem(QUOTE_STORAGE_KEY);
    const savedCustomer = localStorage.getItem(QUOTE_CUSTOMER_KEY);
    if (savedCart) quoteCart = JSON.parse(savedCart);
    if (savedCustomer) quoteCustomer = JSON.parse(savedCustomer);
  } catch(e) {
    quoteCart = [];
    quoteCustomer = { name: '', company: '', email: '', date: '' };
  }
}

function isInQuote(model) {
  return quoteCart.some(item => item.model === model);
}

function addToQuote(model) {
  if (isInQuote(model)) return;
  quoteCart.push({ model: model, qty: 100, priceTier: '500' });
  saveQuoteToStorage();
  updateQuoteBadge();
  const cardBtn = document.querySelector('.product-card[data-model="' + model + '"] .quote-btn');
  if (cardBtn) { cardBtn.classList.add('added'); cardBtn.textContent = '\u2713'; }
}

function removeFromQuote(model) {
  const idx = quoteCart.findIndex(item => item.model === model);
  if (idx >= 0) {
    quoteCart.splice(idx, 1);
    saveQuoteToStorage();
    updateQuoteBadge();
    renderQuotePanel();
    const cardBtn = document.querySelector('.product-card[data-model="' + model + '"] .quote-btn');
    if (cardBtn) { cardBtn.classList.remove('added'); cardBtn.textContent = '+'; }
    if (currentModalProduct && currentModalProduct.model === model) {
      const modalBtn = document.getElementById('modalQuoteBtn');
      if (modalBtn) { modalBtn.classList.remove('added'); modalBtn.textContent = '\u52a0\u5165\u62a5\u4ef7\u5355'; }
    }
  }
}

function toggleQuote(model, btnEl) {
  if (isInQuote(model)) { removeFromQuote(model); }
  else { addToQuote(model); }
}

function toggleQuoteFromModal() {
  if (!currentModalProduct) return;
  const model = currentModalProduct.model;
  const btn = document.getElementById('modalQuoteBtn');
  if (isInQuote(model)) {
    removeFromQuote(model);
    if (btn) { btn.classList.remove('added'); btn.textContent = '\u52a0\u5165\u62a5\u4ef7\u5355'; }
  } else {
    addToQuote(model);
    if (btn) { btn.classList.add('added'); btn.textContent = '\u5df2\u52a0\u5165'; }
  }
}

function updateQuoteBadge() {
  const badge = document.getElementById('quoteBadgeCount');
  if (!badge) return;
  const count = quoteCart.length;
  if (count > 0) { badge.textContent = count; badge.style.display = 'flex'; }
  else { badge.style.display = 'none'; }
}

function openQuotePanel() {
  renderQuotePanel();
  populateCustomerFields();
  document.getElementById('quotePanelOverlay').classList.add('show');
  document.getElementById('quotePanel').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeQuotePanel() {
  document.getElementById('quotePanelOverlay').classList.remove('show');
  document.getElementById('quotePanel').classList.remove('show');
  document.body.style.overflow = '';
}

function populateCustomerFields() {
  document.getElementById('qcName').value = quoteCustomer.name || '';
  document.getElementById('qcCompany').value = quoteCustomer.company || '';
  document.getElementById('qcEmail').value = quoteCustomer.email || '';
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('qcDate').value = quoteCustomer.date || today;
}

function updateQuoteCustomer() {
  quoteCustomer.name = document.getElementById('qcName').value.trim();
  quoteCustomer.company = document.getElementById('qcCompany').value.trim();
  quoteCustomer.email = document.getElementById('qcEmail').value.trim();
  quoteCustomer.date = document.getElementById('qcDate').value;
  saveQuoteToStorage();
}

function renderQuotePanel() {
  const body = document.getElementById('quotePanelBody');
  const subtotalEl = document.getElementById('quotePanelSubtotal');
  const totalAmountEl = document.getElementById('quoteTotalAmount');
  if (quoteCart.length === 0) {
    body.innerHTML = '<div class="quote-empty"><div class="quote-empty-icon">&#128196;</div><div class="quote-empty-text">No products selected. Tap "+" on cards to add.</div></div>';
    subtotalEl.style.display = 'none'; return;
  }
  let total = 0; let html = '';
  quoteCart.forEach(item => {
    const p = PRODUCTS.find(x => x.model === item.model);
    if (!p) return;
    const priceField = 'p_' + item.priceTier;
    const unitPrice = parseFloat(p[priceField]) || 0;
    const subtotal = unitPrice * item.qty;
    total += subtotal;
    html += '<div class="quote-item">' +
      '<img class="quote-item-thumb" src="' + (p.image || '') + '" alt="' + item.model + '" onerror="this.style.display=\'none\'">' +
      '<div class="quote-item-info">' +
        '<div class="quote-item-model">' + item.model + '</div>' +
        '<div class="quote-item-type">' + (p.type_en || p.type_cn || p.category) + '</div>' +
        '<div class="quote-item-controls">' +
          '<input type="number" class="quote-item-qty" value="' + item.qty + '" min="1" onchange="updateQuoteItem(\'' + item.model + '\', this.value, \'' + item.priceTier + '\')">' +
          '<select class="quote-item-tier" onchange="updateQuoteItem(\'' + item.model + '\', ' + item.qty + ', this.value)">' +
            '<option value="sample"' + (item.priceTier === 'sample' ? ' selected' : '') + '>Sample</option>' +
            '<option value="500"' + (item.priceTier === '500' ? ' selected' : '') + '>500pcs</option>' +
            '<option value="2000"' + (item.priceTier === '2000' ? ' selected' : '') + '>2000pcs</option>' +
            '<option value="5000"' + (item.priceTier === '5000' ? ' selected' : '') + '>5000pcs</option>' +
          '</select>' +
        '</div>' +
      '</div>' +
      '<button class="quote-item-remove" onclick="removeQuoteItem(\'' + item.model + '\')">&times;</button>' +
    '</div>';
  });
  body.innerHTML = html;
  subtotalEl.style.display = 'block';
  totalAmountEl.textContent = 'RMB ' + total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function updateQuoteItem(model, qty, priceTier) {
  const item = quoteCart.find(x => x.model === model);
  if (!item) return;
  item.qty = Math.max(1, parseInt(qty) || 1);
  item.priceTier = priceTier;
  saveQuoteToStorage();
  renderQuotePanel();
}

function removeQuoteItem(model) { removeFromQuote(model); }

function clearQuote() {
  quoteCart = [];
  saveQuoteToStorage();
  updateQuoteBadge();
  renderQuotePanel();
  document.querySelectorAll('.quote-btn.added').forEach(btn => { btn.classList.remove('added'); btn.textContent = '+'; });
  const modalBtn = document.getElementById('modalQuoteBtn');
  if (modalBtn) { modalBtn.classList.remove('added'); modalBtn.textContent = '\u52a0\u5165\u62a5\u4ef7\u5355'; }
}

function openQuotePreview() {
  if (quoteCart.length === 0) { showToast('Please add at least one product', 'warn'); return; }
  updateQuoteCustomer();
  document.getElementById('quotePreviewBody').innerHTML = generateQuoteHTML();
  document.getElementById('quotePreviewOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeQuotePreview() {
  document.getElementById('quotePreviewOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

function generateQuoteHTML() {
  const date = quoteCustomer.date || new Date().toISOString().slice(0, 10);
  let rows = ''; let total = 0;
  quoteCart.forEach((item, idx) => {
    const p = PRODUCTS.find(x => x.model === item.model);
    if (!p) return;
    const priceField = 'p_' + item.priceTier;
    const unitPrice = parseFloat(p[priceField]) || 0;
    const subtotal = unitPrice * item.qty;
    total += subtotal;
    const desc = (p.type_en || p.type_cn || p.category || '') + (p.ports ? ' | ' + p.ports : '') + (p.power ? ' | ' + p.power : '');
    rows += '<tr><td>' + (idx + 1) + '</td><td>' + item.model + '</td><td>' + desc + '</td><td>' + item.qty + '</td><td>' + (unitPrice > 0 ? 'RMB ' + unitPrice.toFixed(2) : '-') + '</td><td>' + (subtotal > 0 ? 'RMB ' + subtotal.toFixed(2) : '-') + '</td></tr>';
  });
  return '<div class="quote-preview-company"><div class="quote-preview-company-name">Shenzhen Guangxinyi Electronics Co., Ltd.</div><div class="quote-preview-company-sub">GXYKIT Product Quotation</div></div>' +
    '<div class="quote-preview-info"><div class="quote-preview-info-item"><span class="quote-preview-info-label">Customer</span><span class="quote-preview-info-value">' + (quoteCustomer.name || '-') + '</span></div>' +
    '<div class="quote-preview-info-item"><span class="quote-preview-info-label">Company</span><span class="quote-preview-info-value">' + (quoteCustomer.company || '-') + '</span></div>' +
    '<div class="quote-preview-info-item"><span class="quote-preview-info-label">Email</span><span class="quote-preview-info-value">' + (quoteCustomer.email || '-') + '</span></div>' +
    '<div class="quote-preview-info-item"><span class="quote-preview-info-label">Date</span><span class="quote-preview-info-value">' + date + '</span></div></div>' +
    '<table class="quote-preview-table"><thead><tr><th>#</th><th>Model</th><th>Description</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="quote-preview-total">Total: <span>RMB ' + total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</span></div>' +
    '<div class="quote-preview-note">Note: Prices are in RMB, EXW Shenzhen. Valid for 30 days from quotation date. MOQ and lead time subject to confirmation.</div>';
}

function copyQuoteText() {
  const date = quoteCustomer.date || new Date().toISOString().slice(0, 10);
  let text = 'GXYKIT Quotation\nShenzhen Guangxinyi Electronics Co., Ltd.\n\n';
  text += 'Customer: ' + (quoteCustomer.name || '-') + '\nCompany: ' + (quoteCustomer.company || '-') + '\nEmail: ' + (quoteCustomer.email || '-') + '\nDate: ' + date + '\n\n';
  text += '#\tModel\tDescription\tQty\tUnit Price\tSubtotal\n';
  let total = 0;
  quoteCart.forEach((item, idx) => {
    const p = PRODUCTS.find(x => x.model === item.model);
    if (!p) return;
    const priceField = 'p_' + item.priceTier;
    const unitPrice = parseFloat(p[priceField]) || 0;
    const subtotal = unitPrice * item.qty;
    total += subtotal;
    const desc = (p.type_en || p.type_cn || p.category || '') + (p.ports ? ' | ' + p.ports : '') + (p.power ? ' | ' + p.power : '');
    text += (idx + 1) + '\t' + item.model + '\t' + desc + '\t' + item.qty + '\t' + (unitPrice > 0 ? 'RMB ' + unitPrice.toFixed(2) : '-') + '\t' + (subtotal > 0 ? 'RMB ' + subtotal.toFixed(2) : '-') + '\n';
  });
  text += '\nTotal: RMB ' + total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '\n';
  text += '\nNote: Prices are in RMB, EXW Shenzhen. Valid for 30 days from quotation date. MOQ and lead time subject to confirmation.';
  navigator.clipboard.writeText(text).then(() => showToast('Quotation copied to clipboard', 'success')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); showToast('Quotation copied to clipboard', 'success');
  });
}

function exportQuoteCSV() {
  let csv = 'Model,Description,Qty,Price Tier,Unit Price,Total\n';
  let total = 0;
  quoteCart.forEach(item => {
    const p = PRODUCTS.find(x => x.model === item.model);
    if (!p) return;
    const priceField = 'p_' + item.priceTier;
    const unitPrice = parseFloat(p[priceField]) || 0;
    const subtotal = unitPrice * item.qty;
    total += subtotal;
    const desc = (p.type_en || p.type_cn || p.category || '').replace(/,/g, ';');
    csv += '"' + item.model + '","' + desc + '",' + item.qty + ',"' + item.priceTier + '",' + (unitPrice || '') + ',' + (subtotal || '') + '\n';
  });
  csv += '"","","","","Total:",' + total.toFixed(2) + '\n';
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'GXYKIT_Quotation_' + new Date().toISOString().slice(0,10) + '.csv';
  link.click();
  showToast('CSV exported', 'success');
}

// Init quote system
loadQuoteFromStorage();
updateQuoteBadge();

// Init
init();
</script>
<!-- Quote Side Panel (Drawer) -->
<div class="quote-panel-overlay" id="quotePanelOverlay" onclick="closeQuotePanel()"></div>
<div class="quote-panel" id="quotePanel">
  <div class="quote-panel-header">
    <div class="quote-panel-title">Quotation List</div>
    <button class="quote-panel-close" onclick="closeQuotePanel()">&times;</button>
  </div>
  <div class="quote-panel-body" id="quotePanelBody">
    <div class="quote-empty">
      <div class="quote-empty-icon">&#128196;</div>
      <div class="quote-empty-text">No products selected. Tap "+" on cards to add.</div>
    </div>
  </div>
  <div class="quote-panel-subtotal" id="quotePanelSubtotal" style="display:none">Total: <span id="quoteTotalAmount">$0.00</span></div>
  <div class="quote-customer" id="quoteCustomerSection">
    <div class="quote-customer-title">Customer Info</div>
    <div class="quote-field">
      <label for="qcName">Name</label>
      <input type="text" id="qcName" placeholder="Your name" onchange="updateQuoteCustomer()" onblur="updateQuoteCustomer()">
    </div>
    <div class="quote-field">
      <label for="qcCompany">Company</label>
      <input type="text" id="qcCompany" placeholder="Company name" onchange="updateQuoteCustomer()" onblur="updateQuoteCustomer()">
    </div>
    <div class="quote-field">
      <label for="qcEmail">Email</label>
      <input type="email" id="qcEmail" placeholder="email@example.com" onchange="updateQuoteCustomer()" onblur="updateQuoteCustomer()">
    </div>
    <div class="quote-field">
      <label for="qcDate">Date</label>
      <input type="date" id="qcDate" onchange="updateQuoteCustomer()" onblur="updateQuoteCustomer()">
    </div>
  </div>
  <div class="quote-panel-footer">
    <button class="quote-btn-clear" onclick="clearQuote()">Clear</button>
    <button class="quote-btn-generate" onclick="openQuotePreview()">Generate Quotation</button>
  </div>
</div>

<!-- Quote Preview Modal -->
<div class="quote-preview-overlay" id="quotePreviewOverlay" onclick="closeQuotePreview()">
  <div class="quote-preview-modal" onclick="event.stopPropagation()">
    <div class="quote-preview-header">
      <div class="quote-preview-title">Quotation</div>
      <button class="quote-preview-close" onclick="closeQuotePreview()">&times;</button>
    </div>
    <div class="quote-preview-body" id="quotePreviewBody"></div>
    <div class="quote-preview-actions">
      <button class="quote-btn-copy" onclick="copyQuoteText()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy as Text
      </button>
      <button class="quote-btn-export" onclick="exportQuoteCSV()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Excel
      </button>
    </div>
  </div>
</div>

</body>
